<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <!-- Glowing Purple Gradient -->
    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6" />
      <stop offset="50%" stop-color="#a78bfa" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>
    
    <!-- Subtle Drop Shadow -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Base (Transparent/Circle) -->
  <circle cx="50" cy="50" r="46" fill="rgba(15, 12, 30, 0.6)" stroke="url(#purpleGrad)" stroke-width="2" />

  <!-- Rocket/Launch Icon -->
  <g filter="url(#glow)">
    <!-- Left wing -->
    <path d="M38 58 L30 68 C28 71, 32 73, 36 70 L42 63 Z" fill="#8b5cf6" opacity="0.8" />
    
    <!-- Right wing -->
    <path d="M62 58 L70 68 C72 71, 68 73, 64 70 L58 63 Z" fill="#ec4899" opacity="0.8" />

    <!-- Rocket Body -->
    <path d="M50 22 C56 34, 60 46, 58 60 C58 64, 52 66, 50 66 C48 66, 42 64, 42 60 C40 46, 44 34, 50 22 Z" fill="url(#purpleGrad)" />

    <!-- Rocket Window -->
    <circle cx="50" cy="42" r="5" fill="#0f0c1e" stroke="#ffffff" stroke-width="1.5" />

    <!-- Flame / Boost -->
    <path d="M46 68 C46 76, 50 82, 50 82 C50 82, 54 76, 54 68 C54 66, 46 66, 46 68 Z" fill="#f59e0b" />
    <path d="M48 68 C48 73, 50 77, 50 77 C50 77, 52 73, 52 68 C52 67, 48 67, 48 68 Z" fill="#ef4444" />
  </g>
</svg>
